name: Market bot tests

on:
  push:
    paths:
      - "app/data/**"
      - "market_bot/**"
      - "requirements.txt"
      - ".github/workflows/market-bot-tests.yml"
  pull_request:
    paths:
      - "app/data/**"
      - "market_bot/**"
      - "requirements.txt"
      - ".github/workflows/market-bot-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install requests flake8
      - name: Run provider tests
        run: python -m unittest discover -s app/data/tests
      - name: Run market bot tests
        run: python -m unittest discover -s market_bot/tests
      - name: Compile bot and provider modules
        run: python -m compileall -q app/data market_bot
      - name: Lint bot and provider modules
        run: python -m flake8 --max-line-length=120 app/data market_bot
